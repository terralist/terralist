      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/ModuleName"
        - $ref: "#/components/parameters/ModuleProvider"
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/AuthorityNotFound" }

  /v1/api/modules/{namespace}/{name}/{provider}/{version}/remove:
    delete:
      tags: [Modules]
      operationId: deleteModuleVersion
      summary: Remove a module version
      description: Requires the `delete` action on the module.
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/ModuleName"
        - $ref: "#/components/parameters/ModuleProvider"
        - $ref: "#/components/parameters/Version"
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/AuthorityNotFound" }

  /v1/api/providers/{namespace}/{name}/{version}/upload:
    post:
      tags: [Providers]
      operationId: uploadProviderVersion
      summary: Upload a provider version
      description: |
        Creates a provider version from files Terralist downloads. Requires the
        `create` action on the provider.

        The files are downloaded from `http` or `https` URLs; other sources are
        refused. `headers` are sent with every download. When a storage backend
        holds the files, the `SHA256SUMS` signature must verify with one of the
        authority keys.
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/ProviderName"
        - $ref: "#/components/parameters/Version"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderUpload"
            example:
              protocols: ["5.0"]
              headers:
                Accept: application/octet-stream
                Authorization: Bearer TOKEN
                X-GitHub-Api-Version: "2022-11-28"
              shasums:
                url: https://api.github.com/repos/OWNER/REPO/releases/assets/SHA256SUMS_ASSET_ID
                signature_url: https://api.github.com/repos/OWNER/REPO/releases/assets/SHA256SUMS_SIG_ASSET_ID
              platforms:
                - os: linux
                  arch: amd64
                  download_url: https://api.github.com/repos/OWNER/REPO/releases/assets/LINUX_AMD64_ASSET_ID
                  shasum: 9c8b7a6f5e4d3c2b1a0f9e8d7c6b5a4f3e2d1c0b9a8f7e6d5c4b3a2f1e0d9c8b
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/AuthorityNotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/api/providers/{namespace}/{name}/{version}/upload-files:
    post:
      tags: [Providers]
      operationId: uploadProviderPackages
      summary: Upload provider packages
      description: |
        Creates a provider version from its package files, as produced by
        `terraform providers mirror`. Requires the `create` action on the
        provider, and a providers storage resolver.

        Every archive must be listed in the version document under its file
        name. When a `SHA256SUMS` file is given, every archive must match its
        entry. A version uploaded without `shasums` is served through the
        [network mirror](../user-guide/network-mirror.md) only and does not
        appear in the registry protocol version list.
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/ProviderName"
        - $ref: "#/components/parameters/Version"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [metadata, archives]
              properties:
                metadata:
                  type: string
                  format: binary
                  description: The `<version>.json` document listing the packages and their `h1` hashes.
                archives:
                  type: array
                  items: { type: string, format: binary }
                  description: The package archives listed in the document.
                shasums:
                  type: string
                  format: binary
                  description: The provider's `SHA256SUMS` file. Sent together with `shasums_signature`.
                shasums_signature:
                  type: string
                  format: binary
                  description: The signature of `SHA256SUMS`, which must verify with one of the authority keys.
                protocols:
                  type: string
                  description: Comma separated provider protocol versions. Required with `shasums`.
                  example: "5.0"
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400":
          description: The form is invalid.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Errors" }
              example:
                errors: ["expecting exactly one version document in the \"metadata\" field"]
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/AuthorityNotFound" }
        "409":
          description: The packages could not be stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Errors" }
              example:
                errors: ["package terraform-provider-null_3.2.4_linux_amd64.zip does not match its SHA256SUMS entry"]

  /v1/api/providers/{namespace}/{name}/{version}/fetch:
    post:
      tags: [Providers]
      operationId: fetchProviderPackages
      summary: Fetch provider packages from the upstream
      description: >-
        Downloads the given platforms of a version from the upstream registry
        the authority stands for into storage, so that later installs are
        served without reaching the upstream. Each platform succeeds or fails
        on its own. Requires the `create` action on the provider. See
        [pulling providers through](../user-guide/network-mirror.md#pulling-providers-through-from-an-upstream).
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/ProviderName"
        - $ref: "#/components/parameters/Version"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [platforms]
              properties:
                platforms:
                  type: array
                  minItems: 1
                  items: { type: string, description: "`<os>_<arch>`" }
            example:
              platforms: [linux_amd64, darwin_arm64]
      responses:
        "200":
          description: The outcome of each platform.
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items: { $ref: "#/components/schemas/FetchResult" }
              example:
                results:
                  - platform: linux_amd64
                  - platform: darwin_arm64
                    error: version not allowed by the upstream rules
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/api/providers/{namespace}/{name}/remove:
    delete:
      tags: [Providers]
      operationId: deleteProvider
      summary: Remove a provider
      description: Removes a provider with all its versions. Requires the `delete` action on the provider.
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/ProviderName"
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/api/providers/{namespace}/{name}/{version}/remove:
    delete:
      tags: [Providers]
      operationId: deleteProviderVersion
      summary: Remove a provider version
      description: Requires the `delete` action on the provider.
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/ProviderName"
        - $ref: "#/components/parameters/Version"
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/AuthorityNotFound" }

  /v1/api/modules/{namespace}/{name}/{provider}/webhook/{vcs}:
    post:
      tags: [Webhooks]
      operationId: moduleReleaseWebhook
      summary: Module release webhook
      description: >-
        Creates a module version from a published release. The archive is taken
