openapi: 3.1.0

info:
  title: Terralist API
  version: v1
  summary: Terraform/OpenTofu private registry for modules and providers.
  description: |
    Every route served by Terralist: the Terraform/OpenTofu registry, login and
    network mirror protocols, the management API used by the web UI and by
    automation, and the operational endpoints.

    ## Authentication

    Most routes accept any of the following credentials:

    - the token issued by `terraform login`: `Authorization: Bearer <TOKEN>`;
    - an API key, or the [`master-api-key`](../configuration.md#master-api-key):
      `Authorization: Bearer x-api-key:<KEY>`, or `X-API-Key: <KEY>`;
    - the web UI session cookie, `_session` with the `cookie`
      [session store](../configuration.md#session-store) and `_session_id`
      with the `database` one.

    The registry and network mirror protocol routes can also be read
    anonymously when [`modules-anonymous-read`](../configuration.md#modules-anonymous-read)
    or [`providers-anonymous-read`](../configuration.md#providers-anonymous-read)
    is set, or when the authority is public. The download links they issue
    carry a short-lived `token`, since Terraform downloads without credentials.
    Webhooks are authenticated by their `X-Hub-Signature-256` signature,
    computed with [`gh-webhook-secret`](../configuration.md#gh-webhook-secret).

    Once authenticated, each route checks the caller's
    [RBAC policies](../user-guide/rbac-configuration.md) for the action it
    lists.

    ## Errors

    Errors are returned as a list of messages, unless noted otherwise:

    ```json
    {
      "errors": ["authority \"my-corp\" not found"]
    }
    ```

    When the caller may not perform an action, the response is a `403` with
    an empty body.

    ## Example

    ```shell
    curl -L -X POST \
      -H "Authorization: Bearer x-api-key:<KEY>" \
      -F module=@module.zip \
      http://localhost:5758/v1/api/modules/NAMESPACE/NAME/PROVIDER/VERSION/upload-files
    ```
  license:
    name: Mozilla Public License 2.0
    url: https://github.com/terralist/terralist/blob/master/LICENSE

servers:
  - url: http://localhost:5758
    description: Local development instance

tags:
  - name: Probes
    description: Liveness and readiness probes.
  - name: Metrics
    description: Prometheus metrics.
  - name: Service Discovery
    description: >-
      The [remote service discovery](https://developer.hashicorp.com/terraform/internals/remote-service-discovery)
      document Terraform/OpenTofu read before talking to the registry.
  - name: Login Protocol
    description: >-
      The [login protocol](https://developer.hashicorp.com/terraform/internals/login-protocol)
      behind `terraform login`: an OAuth 2.0 authorization code grant with PKCE.
  - name: Module Registry Protocol
    description: >-
      The [module registry protocol](https://developer.hashicorp.com/terraform/internals/module-registry-protocol).
      Readable anonymously when [`modules-anonymous-read`](../configuration.md#modules-anonymous-read)
      is set or the authority is public.
  - name: Provider Registry Protocol
    description: >-
      The [provider registry protocol](https://developer.hashicorp.com/terraform/internals/provider-registry-protocol).
      Readable anonymously when [`providers-anonymous-read`](../configuration.md#providers-anonymous-read)
      is set or the authority is public.
  - name: Provider Network Mirror
    description: >-
      The [provider network mirror protocol](https://developer.hashicorp.com/terraform/internals/provider-network-mirror-protocol).
      See the [Provider Network Mirror](../user-guide/network-mirror.md) guide.
  - name: Modules
    description: Upload, fetch and remove module versions.
  - name: Providers
    description: Upload, fetch and remove provider versions.
  - name: Webhooks
    description: >-
      Create versions from VCS release events. See [VCS release webhooks](../user-guide/webhook-vcs-releases.md).
  - name: Authorities
    description: Manage authorities, their signing keys and their upstream rules.
  - name: API Keys
    description: Manage API keys.
  - name: Artifacts
    description: Browse the modules and providers visible to the caller. Used by the web UI.
  - name: Session
    description: The web UI session and what the signed-in user may do.
  - name: SAML
    description: >-
      Registered only when SAML is the authentication provider, and served over
      HTTPS only. See [SAML Configuration](../user-guide/saml-configuration.md).
  - name: Files
    description: >-
      Serves the files kept by the `local` storage resolver. Registered only
      when a local resolver is configured.
  - name: Internal
    description: Runtime settings read by the web UI.

security:
  - terraformToken: []
  - apiKey: []
  - apiKeyHeader: []
  - session: []

paths:
  /check/healthz:
    get:
      tags: [Probes]
      operationId: getLiveness
      summary: Liveness probe
      description: Responds with `200` while the process is serving requests.
      security: []
      responses:
        "200":
          description: The instance is alive.

  /check/readyz:
    get:
      tags: [Probes]
      operationId: getReadiness
      summary: Readiness probe
      description: Responds with `200` once the instance finished starting up and can serve traffic.
      security: []
      responses:
        "200":
          description: The instance is ready.
        "503":
          description: The instance is not ready yet.

  /metrics:
    get:
      tags: [Metrics]
      operationId: getMetrics
      summary: Prometheus metrics
      description: >-
        Served on the main port only when [`metrics-port`](../configuration.md#metrics-port)
        is not set; otherwise it is served on that port. See [Monitoring and Observability](../user-guide/monitoring.md).
      security: []
      responses:
        "200":
          description: Metrics in the Prometheus exposition format.
          content:
            text/plain:
              schema:
                type: string

  /.well-known/terraform.json:
    get:
      tags: [Service Discovery]
      operationId: getServiceDiscovery
      summary: Get the service discovery document
      description: Tells Terraform/OpenTofu where to find the login, module and provider endpoints.
      security: []
      responses:
        "200":
          description: The service discovery document.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceDiscovery"
              example:
                login.v1:
                  authz: /v1/auth/authorization
                  client: terraform-cli
                  grant_types: [authz_code]
                  ports: [10000, 10010]
                  token: /v1/auth/token
                modules.v1: /v1/modules/
                providers.v1: /v1/providers/

  /v1/auth/authorization:
    get:
      tags: [Login Protocol]
      operationId: authorize
      summary: Start an authorization
      description: >-
        Redirects the user to the configured identity provider. Once they sign
        in, the identity provider sends them back to `/v1/api/auth/redirect`,
        which redirects to `redirect_uri` with an authorization `code`.
      security: []
      parameters:
        - { name: client_id, in: query, required: true, schema: { type: string }, example: terraform-cli }
        - name: redirect_uri
          in: query
          required: true
          description: Must be a loopback address or an address on Terralist's own host.
          schema: { type: string, format: uri }
        - { name: response_type, in: query, required: true, schema: { type: string, const: code } }
        - { name: state, in: query, required: true, schema: { type: string } }
        - { name: code_challenge, in: query, required: true, schema: { type: string } }
        - { name: code_challenge_method, in: query, required: true, schema: { type: string, const: S256 } }
      responses:
        "302":
          description: >-
            Redirect to the identity provider or, on error, to `redirect_uri`
            with the `error` and `error_description` query parameters.
          headers:
            Location: { $ref: "#/components/headers/Location" }
        "400":
          $ref: "#/components/responses/BadRequest"

  /v1/auth/token:
    post:
      tags: [Login Protocol]
      operationId: exchangeToken
      summary: Exchange a code for a token
      description: >-
        Exchanges an authorization code for an access token. The token is then
        sent as `Authorization: Bearer <token>`; its lifetime is set by
        [`auth-token-expiration`](../configuration.md#auth-token-expiration).
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [client_id, code, code_verifier, grant_type, redirect_uri]
              properties:
                client_id: { type: string }
                code: { type: string }
                code_verifier: { type: string }
                grant_type: { type: string, const: authorization_code }
                redirect_uri: { type: string, format: uri }
      responses:
        "200":
          description: The access token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "302":
          description: >-
            The code could not be exchanged. Redirect to `redirect_uri` with the
            `error` and `error_description` query parameters.
          headers:
            Location: { $ref: "#/components/headers/Location" }

  /v1/api/auth/redirect:
    get:
      tags: [Login Protocol]
      operationId: authorizationCallback
      summary: Identity provider callback
      description: >-
        Where the identity provider sends the user back. When the flow was
        started by the web UI, the user is saved in the session and redirected
        back to the UI; otherwise they are redirected to the client's
        `redirect_uri` with an authorization `code`.
      security: []
      parameters:
        - { name: code, in: query, required: true, schema: { type: string } }
        - { name: state, in: query, required: true, schema: { type: string } }
      responses:
        "302":
          description: >-
            Redirect to the web UI or the client, with the `error` and
            `error_description` query parameters on error.
          headers:
            Location: { $ref: "#/components/headers/Location" }
        "400":
          description: The code or state is missing or invalid.

  /v1/api/auth/session:
    get:
      tags: [Session]
      operationId: getSession
      summary: Get the signed-in user
      security:
        - session: []
      responses:
        "200":
          description: The user saved in the session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionUser"
              example:
                name: Jane Doe
                email: jane@example.com
                groups: [platform]
                authority: ""
                authority_id: ""
        "401":
          description: No session.
        "403":
          description: The session holds no user.
        "409":
          description: The session holds a user in an unknown format.
    delete:
      tags: [Session]
      operationId: deleteSession
      summary: Sign out
      description: Removes the user from the session.
      security:
        - session: []
      responses:
        "202":
          description: There was no session to clear.
        "204":
          description: The user was signed out.
        "500":
          $ref: "#/components/responses/Error"

  /v1/api/auth/capabilities/settings:
    get:
      tags: [Session]
      operationId: getSettingsCapability
      summary: Check access to the settings page
      description: Reports whether the caller may perform the `get` action on the `settings` resource.
      responses:
        "200":
          description: Whether the caller may open the settings page.
          content:
            application/json:
              schema:
                type: object
                required: [allowed]
                properties:
                  allowed: { type: boolean }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/api/auth/saml/metadata:
    get:
      tags: [SAML]
      operationId: getSamlMetadata
      summary: Service provider metadata
      description: The SAML service provider metadata to register with the identity provider.
      security: []
      responses:
        "200":
          description: The metadata document.
          content:
            application/xml:
              schema:
                type: string
        "403":
          $ref: "#/components/responses/SamlRequiresHttps"
        "500":
          description: The metadata could not be generated.

  /v1/api/auth/saml/acs:
    post:
      tags: [SAML]
      operationId: samlAssertionConsumer
      summary: Assertion consumer service
      description: >-
        Receives the identity provider's SAML response. Requests are rate
        limited to 10 per minute per client.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [SAMLResponse, RelayState]
              properties:
                SAMLResponse: { type: string }
                RelayState: { type: string }
      responses:
        "302":
          description: >-
            Redirect to the web UI or the client, with the `error` and
            `error_description` query parameters on error.
          headers:
            Location: { $ref: "#/components/headers/Location" }
        "400":
          description: The SAML response or relay state is missing or invalid.
        "403":
          $ref: "#/components/responses/SamlRequiresHttps"
        "429":
          description: Too many requests.

  /v1/modules/{namespace}/{name}/{provider}/versions:
    get:
      tags: [Module Registry Protocol]
      operationId: listModuleVersions
      summary: List module versions
      description: >-
        Lists the versions of a module. When the authority pulls through from
        an upstream registry, the upstream versions allowed by its rules are
        included.
      security: &registryRead
        - {}
        - terraformToken: []
        - apiKey: []
        - apiKeyHeader: []
        - session: []
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/ModuleName"
        - $ref: "#/components/parameters/ModuleProvider"
      responses:
        "200":
          description: The module versions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModuleVersionList"
              example:
                modules:
                  - versions:
                      - version: 5.6.0
                      - version: 5.7.0
                      - version: 5.7.1
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFoundString"
        "502":
          $ref: "#/components/responses/UpstreamUnavailableString"

  /v1/modules/{namespace}/{name}/{provider}/{version}/download:
    get:
      tags: [Module Registry Protocol]
      operationId: downloadModuleVersion
      summary: Download a module version
      description: >-
        Answers with the location of the module archive in the
        `X-Terraform-Get` header. Versions not stored yet point to the
        `archive` route, which fetches them from the upstream registry.
      security: *registryRead
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/ModuleName"
        - $ref: "#/components/parameters/ModuleProvider"
        - $ref: "#/components/parameters/Version"
      responses:
        "204":
          description: The archive location is in the `X-Terraform-Get` header.
          headers:
            X-Terraform-Get: { $ref: "#/components/headers/XTerraformGet" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamUnavailable"

  /v1/modules/{namespace}/{name}/{provider}/{version}/archive:
    get:
      tags: [Module Registry Protocol]
      operationId: getModuleArchive
      summary: Get a module archive
      description: >-
        Serves the archive of a version, fetching it from the upstream registry
        first when the caller may create the module or presents the `token`
        issued with the `download` answer. Answers with the storage location
        in the `X-Terraform-Get` header.
      security:
        - {}
        - downloadToken: []
        - terraformToken: []
        - apiKey: []
        - apiKeyHeader: []
        - session: []
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/ModuleName"
        - $ref: "#/components/parameters/ModuleProvider"
        - $ref: "#/components/parameters/Version"
      responses:
        "204":
          description: The archive location is in the `X-Terraform-Get` header.
          headers:
            X-Terraform-Get: { $ref: "#/components/headers/XTerraformGet" }
        "403":
          description: The version is not stored and the caller may not fetch it.
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamUnavailable"

  /v1/providers/{namespace}/{name}/versions:
    get:
      tags: [Provider Registry Protocol]
      operationId: listProviderVersions
      summary: List provider versions
      description: >-
        Lists the versions of a provider and their platforms. Versions uploaded
        without a signed `SHA256SUMS` file are served by the network mirror
        only and are left out.
      security: *registryRead
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/ProviderName"
      responses:
        "200":
          description: The provider versions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderVersionList"
              example:
                versions:
                  - version: 5.46.0
                    protocols: ["5.0"]
                    platforms:
                      - { os: linux, arch: amd64 }
                      - { os: darwin, arch: arm64 }
                      - { os: windows, arch: amd64 }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFoundString"
        "502":
          $ref: "#/components/responses/UpstreamUnavailableString"

  /v1/providers/{namespace}/{name}/{version}/download/{os}/{arch}:
    get:
      tags: [Provider Registry Protocol]
      operationId: downloadProviderVersion
      summary: Download a provider version
      description: >-
        Describes the package of a provider version for one platform: where to
        download it, its checksums and the keys that sign them.
      security: *registryRead
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/ProviderName"
        - $ref: "#/components/parameters/Version"
        - { name: os, in: path, required: true, schema: { type: string }, example: linux }
        - { name: arch, in: path, required: true, schema: { type: string }, example: amd64 }
      responses:
        "200":
          description: The package.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderDownload"
              example:
                protocols: ["5.0"]
                os: linux
                arch: amd64
                filename: terraform-provider-aws_5.46.0_linux_amd64.zip
                download_url: https://bucket.s3.amazonaws.com/providers/hashicorp/aws/5.46.0/terraform-provider-aws_5.46.0_linux_amd64.zip?X-Amz-Signature=...
                shasums_url: https://bucket.s3.amazonaws.com/providers/hashicorp/aws/5.46.0/terraform-provider-aws_5.46.0_SHA256SUMS?X-Amz-Signature=...
                shasums_signature_url: https://bucket.s3.amazonaws.com/providers/hashicorp/aws/5.46.0/terraform-provider-aws_5.46.0_SHA256SUMS.sig?X-Amz-Signature=...
                shasum: 37cdf4292649a10f12858622826925e18ad4eca354c31f61d02c66895eb91274
                signing_keys:
                  gpg_public_keys:
                    - key_id: 34365D9472D7468F
                      ascii_armor: "-----BEGIN PGP PUBLIC KEY BLOCK-----\n...\n-----END PGP PUBLIC KEY BLOCK-----"
                      trust_signature: ""
                      string: hashicorp
                      source_url: https://www.hashicorp.com/security.html
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/UpstreamUnavailable"

  /providers/{hostname}/{namespace}/{name}/index.json:
    get:
      tags: [Provider Network Mirror]
      operationId: listMirrorVersions
      summary: List provider versions (network mirror)
      description: >-
        Lists the versions of a provider. Under Terralist's own hostname the
        namespace is the authority name; under any other hostname the request
        is served by the authority standing for that upstream hostname and
        namespace, which may be created on the fly by
        [`upstream-auto-create`](../configuration.md#upstream-auto-create).
      security: *registryRead
      parameters:
        - $ref: "#/components/parameters/Hostname"
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/ProviderName"
      responses:
        "200":
          description: The provider versions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MirrorVersionList"
              example:
                versions:
                  3.2.3: {}
                  3.2.4: {}
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamUnavailable"

  /providers/{hostname}/{namespace}/{name}/{version}:
    get:
      tags: [Provider Network Mirror]
      operationId: getMirrorDocument
      summary: List installation packages, or download a package
      description: |
        The last path element is either:

        - `<version>.json`: lists the installation packages of a version. The
          `url` of each package may be temporary. Each package carries its
          `zh:` hash, the sha256 of the package, preceded by its `h1:` hash when
          the uploader provided one.
        - a package file name, such as `terraform-provider-null_3.2.4_linux_amd64.zip`:
          redirects to the package in storage, fetching it from the upstream
          registry first when the caller may create the provider or presents
          the `token` carried by the package `url`.
      security:
        - {}
        - downloadToken: []
        - terraformToken: []
        - apiKey: []
        - apiKeyHeader: []
        - session: []
      parameters:
        - $ref: "#/components/parameters/Hostname"
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/ProviderName"
        - name: version
          in: path
          required: true
          description: A version document, `<version>.json`, or a package file name.
          schema: { type: string }
          example: 3.2.4.json
      responses:
        "200":
          description: The installation packages of the version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MirrorArchives"
              example:
                archives:
                  darwin_arm64:
                    url: https://bucket.s3.amazonaws.com/providers/hashicorp/null/3.2.4/terraform-provider-null_3.2.4_darwin_arm64.zip?...
                    hashes: ["zh:2a3f1f4b7b0d1e2c9a6f0c3e6d5b4a8f7e6d5c4b3a2f1e0d9c8b7a6f5e4d3c2b"]
                  linux_amd64:
                    url: https://bucket.s3.amazonaws.com/providers/hashicorp/null/3.2.4/terraform-provider-null_3.2.4_linux_amd64.zip?...
                    hashes: ["zh:9c8b7a6f5e4d3c2b1a0f9e8d7c6b5a4f3e2d1c0b9a8f7e6d5c4b3a2f1e0d9c8b"]
        "302":
          description: Redirect to the package in storage.
          headers:
            Location: { $ref: "#/components/headers/Location" }
        "403":
          description: >-
            The caller may not read the provider, or the package is not stored
            and the caller may not fetch it.
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/UpstreamUnavailable"

  /v1/api/modules/{namespace}/{name}/{provider}/{version}/upload:
    post:
      tags: [Modules]
      operationId: uploadModuleVersion
      summary: Upload a module version
      description: |
        Creates a module version from an archive Terralist downloads. Requires
        the `create` action on the module.

        The archive is downloaded from an `http` or `https` URL, or from a git
        repository (`git::https://...` or `git::ssh://...`, as in a Terraform
        module source); other sources are refused. A git host resolving to a
        private address is refused unless
        [`fetch-allow-private-addresses`](../configuration.md#fetch-allow-private-addresses)
        is set. `headers` are sent with `http` and `https` downloads only.
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/ModuleName"
        - $ref: "#/components/parameters/ModuleProvider"
        - $ref: "#/components/parameters/Version"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModuleUpload"
            examples:
              githubApi:
                summary: GitHub release asset
                description: >-
                  The `archive=zip` query argument tells Terralist that the
                  asset is a zip archive, since the API URL has no extension.
                value:
                  download_url: https://api.github.com/repos/OWNER/REPO/releases/assets/ASSET_ID?archive=zip
                  headers:
                    Accept: application/octet-stream
                    Authorization: Bearer TOKEN
                    X-GitHub-Api-Version: "2022-11-28"
              githubArchive:
                summary: GitHub tag archive
                value:
                  download_url: https://github.com/OWNER/REPO/archive/refs/tags/TAG.zip
                  headers:
                    Authorization: Basic BASE64_USERNAME_AND_TOKEN
              git:
                summary: Git repository
                value:
                  download_url: git::https://github.com/OWNER/REPO.git?ref=v1.0.0
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/BadRequest" }
