          description: The version is not held by the upstream, or the upstream rules deny it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Errors" }
              example:
                errors: ["version not allowed by the upstream rules"]
        "502":
          $ref: "#/components/responses/UpstreamUnavailable"

  /v1/api/modules/{namespace}/{name}/{provider}/{version}/submodules/{submodulePath}:
    get:
