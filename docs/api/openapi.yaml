          schema: { type: string }
          example: modules/vpc-endpoints
      responses:
        "200":
          description: The submodule documentation.
          content:
            application/json:
              schema:
                type: object
                required: [documentation]
                properties:
                  documentation:
                    type: string
                    description: The submodule README, in Markdown.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/api/modules/{namespace}/{name}/{provider}/remove:
    delete:
      tags: [Modules]
