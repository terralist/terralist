        "404": { $ref: "#/components/responses/AuthorityNotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/Error" }

  /v1/api/modules/{namespace}/{name}/{provider}/{version}/fetch:
    post:
      tags: [Modules]
      operationId: fetchModuleVersion
      summary: Fetch a module version from the upstream
      description: >-
        Downloads a module version from the upstream registry the authority
        stands for into storage, so that later installs are served without
        reaching the upstream. Requires the `create` action on the module. See
        [pulling modules through](../user-guide/network-mirror.md#pulling-modules-through-from-an-upstream).
      parameters:
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/ModuleName"
        - $ref: "#/components/parameters/ModuleProvider"
        - $ref: "#/components/parameters/Version"
