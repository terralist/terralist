site_name: Terralist
site_url: https://www.terralist.io
site_description: Terraform/OpenTofu Private Registry for modules and providers manageable from a REST API
site_author: Valentin Deaconu

repo_url: https://github.com/terralist/terralist/
edit_uri: blob/master/docs/

theme:
  name: material
  features:
    - content.code.copy
    - content.code.select
    - navigation.indexes
  logo: assets/terralist.svg
  favicon: assets/terralist.svg
  palette: 
    - scheme: default
      primary: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
      font:
        text: Monserrat
        code: Roboto Mono
    - scheme: slate
      primary: green
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
      font:
        text: Monserrat
        code: Roboto Mono

nav:
  - Home: index.md
  - Installation: installation.md
  - Getting Started: getting-started.md
  - Configuration: configuration.md
  - Artifacts Documentation: artifacts-documentation.md
  - User Guide: 
    - user-guide/index.md
    - AWS S3 Bucket Configuration: user-guide/aws-s3-bucket-configuration.md
    - RBAC Configuration: user-guide/rbac-configuration.md
    - SAML Configuration: user-guide/saml-configuration.md
    - Monitoring and Observability: user-guide/monitoring.md
    - Provider Network Mirror: user-guide/network-mirror.md
    - VCS Release Webhooks: user-guide/webhook-vcs-releases.md
    - Security: user-guide/security.md
    - Upgrading to v0.11: user-guide/upgrading-to-v0.11.md
  - Developer Guide: 
    - dev-guide/index.md
    - API Reference: dev-guide/api-reference.md
    - Local Development: dev-guide/local-development.md
    - E2E Testing: dev-guide/e2e-testing.md

plugins:
  - search
  - neoteroi.mkdocsoad:
      use_pymdownx: true
      templates_path: docs/api/templates

extra_css:
  - assets/css/neoteroi-mkdocs.css
  - assets/css/api-reference.css

exclude_docs: |
  api/templates/

extra:
  version:
    provider: mike
    default: latest

copyright: Made with ❤️ by Terralist contributors.

markdown_extensions:
  - toc:
      permalink: ¶
  - attr_list
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
